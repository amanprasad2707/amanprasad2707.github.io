
services:
  jekyll-site:
    build: .
    image: jekyll-site
    volumes:
      - .:/usr/src/app
    ports:
      - "4000:4000"
      - "35729:35729"
    environment:
      JEKYLL_ENV: docker
      BUNDLE_PATH: /usr/local/bundle
    command: bundle exec jekyll serve -H 0.0.0.0 --watch --livereload --force_polling --config _config.yml,_config_docker.yml
